name: farm

# A long keyspace search that cannot finish inside one runner session.
# Every run picks up the state file left by the previous run, works for a
# bounded amount of time, saves a fresh state file and uploads it as an
# artifact - so the job keeps grinding across runs.

on:
  workflow_dispatch:
    inputs:
      hash:
        description: 'target MD5 hash to crack'
        required: true
      charset:
        description: 'charset spec (digits, lower+digits, alnum, ...)'
        required: false
        default: 'digits'
      min:
        description: 'min length'
        required: false
        default: '1'
      max:
        description: 'max length'
        required: false
        default: '8'
      salt:
        description: 'salt (optional)'
        required: false
        default: ''
      saltpos:
        description: 'salt position (pre|post)'
        required: false
        default: 'pre'
      minutes:
        description: 'minutes to work in this run'
        required: false
        default: '300'
      threads:
        description: 'worker threads'
        required: false
        default: '4'
  schedule:
    # every 6 hours - the farm keeps resuming on its own
    - cron: '17 */6 * * *'

permissions:
  contents: read
  actions: read

env:
  FARM_DIR: farm

jobs:
  farm:
    name: grind keyspace
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Resolve settings
        id: cfg
        env:
          IN_HASH: ${{ inputs.hash || vars.FARM_HASH }}
          IN_CHARSET: ${{ inputs.charset || 'digits' }}
          IN_MIN: ${{ inputs.min || '1' }}
          IN_MAX: ${{ inputs.max || '8' }}
          IN_SALT: ${{ inputs.salt || vars.FARM_SALT || '' }}
          IN_SALTPOS: ${{ inputs.saltpos || 'pre' }}
          IN_MINUTES: ${{ inputs.minutes || '300' }}
          IN_THREADS: ${{ inputs.threads || '4' }}
        run: |
          set -eu
          echo "hash=$IN_HASH" >> "$GITHUB_OUTPUT"
          echo "charset=$IN_CHARSET" >> "$GITHUB_OUTPUT"
          echo "min=$IN_MIN" >> "$GITHUB_OUTPUT"
          echo "max=$IN_MAX" >> "$GITHUB_OUTPUT"
          echo "salt=$IN_SALT" >> "$GITHUB_OUTPUT"
          echo "saltpos=$IN_SALTPOS" >> "$GITHUB_OUTPUT"
          echo "minutes=$IN_MINUTES" >> "$GITHUB_OUTPUT"
          echo "threads=$IN_THREADS" >> "$GITHUB_OUTPUT"
          if [ -z "$IN_HASH" ]; then
            echo "no target hash configured - set the dispatch input or the"
            echo "FARM_HASH repository variable"
          fi

      - name: Build
        run: make

      - name: Restore previous state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p "$FARM_DIR"
          prev="$(gh run list --workflow farm.yml --status completed \
                   --limit 1 --json databaseId \
                   --jq '.[0].databaseId // empty' || true)"
          if [ -n "$prev" ]; then
            echo "previous farm run: $prev"
            gh run download "$prev" -n farm-state -D "$FARM_DIR" || \
              echo "no farm-state artifact in run $prev (starting fresh)"
          else
            echo "no previous farm run found (starting fresh)"
          fi
          ls -l "$FARM_DIR" || true

      - name: Grind
        id: grind
        env:
          CFG_HASH: ${{ steps.cfg.outputs.hash }}
          CFG_CHARSET: ${{ steps.cfg.outputs.charset }}
          CFG_MIN: ${{ steps.cfg.outputs.min }}
          CFG_MAX: ${{ steps.cfg.outputs.max }}
          CFG_SALT: ${{ steps.cfg.outputs.salt }}
          CFG_SALTPOS: ${{ steps.cfg.outputs.saltpos }}
          CFG_MINUTES: ${{ steps.cfg.outputs.minutes }}
          CFG_THREADS: ${{ steps.cfg.outputs.threads }}
        run: |
          set -eu
          if [ -z "$CFG_HASH" ]; then
            echo "::notice::no target hash - nothing to grind"
            echo "done=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$FARM_DIR"
          args="brute -H $CFG_HASH -c $CFG_CHARSET --min $CFG_MIN --max $CFG_MAX"
          args="$args -t $CFG_THREADS --state $FARM_DIR/farm.state -o $FARM_DIR/found.txt"
          if [ -n "$CFG_SALT" ]; then
            args="$args -s $CFG_SALT -p $CFG_SALTPOS"
          fi
          echo "running: ./hashmap $args"
          # SIGTERM at the time limit -> hashmap saves its state and exits.
          # \r is translated to \n so the progress lines stay readable.
          set +e
          timeout -s TERM "${CFG_MINUTES}m" ./hashmap $args 2>&1 | tr '\r' '\n' \
              | tee "$FARM_DIR/log.txt"
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
          if [ -f "$FARM_DIR/farm.state" ]; then
            echo "state saved - next run resumes from here"
          else
            echo "no state file: the run either finished or found nothing left"
          fi

      - name: Report
        id: report
        run: |
          set -eu
          log="$FARM_DIR/log.txt"
          tried=""
          elapsed=""
          rate=""
          progress=""
          if [ -f "$log" ]; then
            tried="$(grep -oE 'done: [0-9,]+ candidates' "$log" | tail -1 \
                     | grep -oE '[0-9,]+' | tr -d ',' || true)"
            elapsed="$(grep -oE 'in [0-9.]+s' "$log" | tail -1 \
                      | grep -oE '[0-9.]+' || true)"
            rate="$(grep -oE '\([0-9.]+ [kMG]?H/s avg\)' "$log" | tail -1 \
                   | tr -d '()' || true)"
            progress="$(grep -E '^\[\*\] len ' "$log" | tail -1 || true)"
          fi
          echo "tried=${tried:-0}" >> "$GITHUB_OUTPUT"
          echo "elapsed=${elapsed:-0}" >> "$GITHUB_OUTPUT"
          echo "rate=${rate:-n/a}" >> "$GITHUB_OUTPUT"
          echo "progress=${progress:-}" >> "$GITHUB_OUTPUT"
          {
            echo '### farm run'
            echo ''
            echo "| metric | value |"
            echo '|--------|-------|'
            echo "| target | \`${{ steps.cfg.outputs.hash }}\` |"
            echo "| charset | \`${{ steps.cfg.outputs.charset }}\` |"
            echo "| lengths | ${{ steps.cfg.outputs.min }}-${{ steps.cfg.outputs.max }} |"
            echo "| tried | ${tried:-0} candidates |"
            echo "| time | ${elapsed:-0} s |"
            echo "| average speed | ${rate:-n/a} |"
            echo "| threads | ${{ steps.cfg.outputs.threads }} |"
            echo ''
            if [ -n "$progress" ]; then
              echo 'last progress line:'
              echo '```'
              echo "$progress"
              echo '```'
              echo ''
            fi
            if [ -f "$FARM_DIR/farm.state" ]; then
              echo 'state saved - the next run continues from here.'
            else
              echo 'no state file - the keyspace is exhausted or the target was found.'
            fi
            if [ -s "$FARM_DIR/found.txt" ]; then
              echo ''
              echo '**cracked:**'
              echo '```'
              cat "$FARM_DIR/found.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload state for the next run
        uses: actions/upload-artifact@v4
        with:
          name: farm-state
          path: ${{ env.FARM_DIR }}
          if-no-files-found: ignore
          retention-days: 30
