name: wordlists

# The combined password list (SecLists + RockYou, deduplicated) and its
# hashmap live in the cloud - in the releases, not in the repository.
#
# This workflow does NOT rebuild them on every run: it downloads what is
# already published and uses it. Building happens only when something is
# missing or when 'rebuild' is requested.

on:
  workflow_dispatch:
    inputs:
      hashes:
        description: 'hashes to look up (optional)'
        required: false
        default: ''
      rebuild:
        description: 'rebuild the list and the map instead of downloading them'
        type: boolean
        default: false
  schedule:
    - cron: '23 4 * * 2'

permissions:
  contents: write

env:
  FARM_DIR: wordlists

jobs:
  build:
    name: use the combined wordlist
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Build hashmap
        run: make

      - name: Get the combined list
        id: get
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p "$FARM_DIR"
          built=false
          if [ "${{ inputs.rebuild }}" = "true" ]; then
            echo "rebuild requested"
          elif gh release download wordlists --pattern 'combined.txt' \
                 --dir "$FARM_DIR" --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
            echo "downloaded the published list"
          else
            echo "no published list yet - building it once"
            ./tools/fetch-wordlists.sh --full \
                --out "$FARM_DIR/combined.txt" --cache "$FARM_DIR/cache"
            built=true
          fi
          [ -s "$FARM_DIR/combined.txt" ] || {
            echo "::error::no combined list"; exit 1; }
          echo "built=$built" >> "$GITHUB_OUTPUT"

      - name: Get the hashmap of the list
        id: getmap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          built=false
          if [ "${{ inputs.rebuild }}" = "true" ]; then
            echo "rebuild requested"
          elif gh release download maps --pattern 'wordlist-map.hmmap' \
                 --dir "$FARM_DIR" --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
            echo "downloaded the published md5 map"
          else
            echo "no published map - building it from the list (once)"
            ./hashmap map -o "$FARM_DIR/wordlist-map.hmmap" \
                --wordlist "$FARM_DIR/combined.txt" \
                --state "$FARM_DIR/map.state" -t "$(nproc)"
            built=true
          fi
          [ -s "$FARM_DIR/wordlist-map.hmmap" ] || {
            echo "::error::no map"; exit 1; }
          echo "built=$built" >> "$GITHUB_OUTPUT"

      - name: Get the sha256 hashmap of the list
        id: getmap256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          built=false
          if [ "${{ inputs.rebuild }}" = "true" ]; then
            echo "rebuild requested"
          elif gh release download maps --pattern 'wordlist-map-sha256.hmmap' \
                 --dir "$FARM_DIR" --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
            echo "downloaded the published sha256 map"
          else
            echo "no published sha256 map - building it (once)"
            # --truncate 16 keeps it the same size as the md5 map
            ./hashmap map -o "$FARM_DIR/wordlist-map-sha256.hmmap" \
                --wordlist "$FARM_DIR/combined.txt" --algo sha256 \
                --truncate 16 \
                --state "$FARM_DIR/map256.state" -t "$(nproc)"
            built=true
          fi
          [ -s "$FARM_DIR/wordlist-map-sha256.hmmap" ] || {
            echo "::error::no sha256 map"; exit 1; }
          echo "built=$built" >> "$GITHUB_OUTPUT"

      - name: Statistics
        id: stats
        run: |
          set -eu
          f="$FARM_DIR/combined.txt"
          m="$FARM_DIR/wordlist-map.hmmap"
          lines=$(wc -l < "$f" | tr -d ' ')
          size=$(du -h "$f" | cut -f1)
          msize=$(du -h "$m" | cut -f1)
          sha=$(sha256sum "$f" | cut -d' ' -f1)
          msha=$(sha256sum "$m" | cut -d' ' -f1)
          echo "$sha  combined.txt" > "$FARM_DIR/SHA256SUMS"
          echo "$msha  wordlist-map.hmmap" >> "$FARM_DIR/SHA256SUMS"
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "msize=$msize" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          {
            echo
            echo '### wordlists'
            echo ''
            echo "| artifact | metric | value |"
            echo "|----------|--------|-------|"
            echo "| combined.txt | candidates | $lines |"
            echo "| combined.txt | size | $size |"
            echo "| wordlist-map.hmmap | size | $msize |"
            echo "| wordlist-map.hmmap | sha256 | \`$msha\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Quick lookup with the map
        if: inputs.hashes != ''
        run: |
          set -eu
          mkdir -p "$FARM_DIR"
          printf '%s\n' "${{ inputs.hashes }}" | tr ' ,' '\n\n' \
              | grep -Eo '[0-9a-fA-F]{32}' | tr 'A-F' 'a-f' \
              | sort -u > "$FARM_DIR/hashes.txt" || true
          total=$(wc -l < "$FARM_DIR/hashes.txt" | tr -d ' ')
          echo "looking up $total hash(es)"
          set +e
          ./hashmap search -F "$FARM_DIR/hashes.txt" \
              "$FARM_DIR/wordlist-map.hmmap" -o "$FARM_DIR/results.txt"
          set -e
          if [ -s "$FARM_DIR/results.txt" ]; then
            echo "cracked:"
            cat "$FARM_DIR/results.txt"
          else
            echo "nothing cracked"
          fi
          {
            echo
            if [ -s "$FARM_DIR/results.txt" ]; then
              echo '**cracked:**'
              echo '```'
              cat "$FARM_DIR/results.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the lookup results
        if: inputs.hashes != ''
        uses: actions/upload-artifact@v4
        with:
          name: wordlist-results
          path: ${{ env.FARM_DIR }}/results.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: Publish the map (only when it was rebuilt)
        if: steps.getmap.outputs.built == 'true' || steps.getmap256.outputs.built == 'true' || inputs.rebuild == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: maps
          name: hashmap maps
          body: |
            The hashmap of the combined password list: every candidate with
            its MD5 digest, ready to search. MD5 only.

            | metric | value |
            |--------|-------|
            | candidates | ${{ steps.stats.outputs.lines }} |
            | size | ${{ steps.stats.outputs.msize }} |

            ```sh
            hashmap search -H <md5hex> wordlist-map.hmmap
            ```
          files: |
            ${{ env.FARM_DIR }}/wordlist-map.hmmap
            ${{ env.FARM_DIR }}/wordlist-map-sha256.hmmap
          fail_on_unmatched_files: false

      - name: Publish the list (only when it was rebuilt)
        if: steps.get.outputs.built == 'true' || inputs.rebuild == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wordlists
          name: hashmap wordlists
          body: |
            The combined password list: SecLists (MIT) plus RockYou,
            deduplicated and sorted. MD5 only.

            | metric | value |
            |--------|-------|
            | candidates | ${{ steps.stats.outputs.lines }} |
            | size | ${{ steps.stats.outputs.size }} |
            | sha256 | `${{ steps.stats.outputs.sha256 }}` |

            ```sh
            hashmap wordlist -H <md5hex> -w combined.txt
            ```
          files: |
            ${{ env.FARM_DIR }}/combined.txt
            ${{ env.FARM_DIR }}/SHA256SUMS
          fail_on_unmatched_files: false
