name: wordlists

# The combined password list (SecLists + RockYou, deduplicated) lives in the
# 'wordlists' release - in the cloud, not in the repository.
#
# This workflow does NOT rebuild it on every run: it downloads the published
# list and uses it. Rebuilding happens only when the list is missing or when
# 'rebuild' is requested.

on:
  workflow_dispatch:
    inputs:
      hashes:
        description: 'hashes to look up with the combined list (optional)'
        required: false
        default: ''
      rebuild:
        description: 'rebuild the list instead of downloading the published one'
        type: boolean
        default: false
  schedule:
    - cron: '23 4 * * 2'

permissions:
  contents: write

env:
  FARM_DIR: wordlists

jobs:
  build:
    name: use the combined wordlist
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Build hashmap
        run: make

      - name: Get the combined list
        id: get
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p "$FARM_DIR"
          built=false
          if [ "${{ inputs.rebuild }}" = "true" ]; then
            echo "rebuild requested"
          elif gh release download wordlists --pattern 'combined.txt' \
                 --dir "$FARM_DIR" --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
            echo "downloaded the published list"
          else
            echo "no published list yet - building it once"
            ./tools/fetch-wordlists.sh --full \
                --out "$FARM_DIR/combined.txt" --cache "$FARM_DIR/cache"
            built=true
          fi
          [ -s "$FARM_DIR/combined.txt" ] || {
            echo "::error::no combined list"; exit 1; }
          echo "built=$built" >> "$GITHUB_OUTPUT"

      - name: Statistics
        id: stats
        run: |
          set -eu
          f="$FARM_DIR/combined.txt"
          lines=$(wc -l < "$f" | tr -d ' ')
          size=$(du -h "$f" | cut -f1)
          sha=$(sha256sum "$f" | cut -d' ' -f1)
          echo "$sha  combined.txt" > "$FARM_DIR/SHA256SUMS"
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          {
            echo
            echo '### combined wordlist'
            echo ''
            echo "| metric | value |"
            echo "|--------|-------|"
            echo "| candidates | $lines |"
            echo "| size | $size |"
            echo "| sha256 | \`$sha\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Quick lookup with the combined list
        if: inputs.hashes != ''
        run: |
          set -eu
          mkdir -p "$FARM_DIR"
          printf '%s\n' "${{ inputs.hashes }}" | tr ' ,' '\n\n' \
              | grep -Eo '[0-9a-fA-F]{32}' | tr 'A-F' 'a-f' \
              | sort -u > "$FARM_DIR/hashes.txt" || true
          total=$(wc -l < "$FARM_DIR/hashes.txt" | tr -d ' ')
          echo "looking up $total hash(es) in ${{ steps.stats.outputs.lines }} candidates"
          set +e
          ./hashmap wordlist -F "$FARM_DIR/hashes.txt" \
              -w "$FARM_DIR/combined.txt" -t "$(nproc)" \
              -o "$FARM_DIR/results.txt"
          set -e
          if [ -s "$FARM_DIR/results.txt" ]; then
            echo "cracked:"
            cat "$FARM_DIR/results.txt"
          else
            echo "nothing cracked"
          fi
          {
            echo
            if [ -s "$FARM_DIR/results.txt" ]; then
              echo '**cracked:**'
              echo '```'
              cat "$FARM_DIR/results.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the lookup results
        if: inputs.hashes != ''
        uses: actions/upload-artifact@v4
        with:
          name: wordlist-results
          path: ${{ env.FARM_DIR }}/results.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: Publish the list (only when it was rebuilt)
        if: steps.get.outputs.built == 'true' || inputs.rebuild == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wordlists
          name: hashmap wordlists
          body: |
            The combined password list: SecLists (MIT) plus RockYou,
            deduplicated and sorted. MD5 only.

            | metric | value |
            |--------|-------|
            | candidates | ${{ steps.stats.outputs.lines }} |
            | size | ${{ steps.stats.outputs.size }} |
            | sha256 | `${{ steps.stats.outputs.sha256 }}` |

            ```sh
            hashmap wordlist -H <md5hex> -w combined.txt
            ```
          files: |
            ${{ env.FARM_DIR }}/combined.txt
            ${{ env.FARM_DIR }}/SHA256SUMS
          fail_on_unmatched_files: false
