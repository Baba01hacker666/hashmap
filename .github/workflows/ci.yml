name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict:
    name: strict build + tests (gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with maximum warnings as errors
        run: make clean && make
      - name: Build the archive companion
        run: make hashmap-archive
      - name: Run test suite
        run: ./tests/run.sh ./hashmap
      - name: Check the map archive and RSM1 codecs
        run: |
          make archive-test
          python3 -B research/rsm1/bench.py --tests-only
          make -C research/rsm1 check
          make evil-test
      - name: Experimental io_uring build + smoke (Linux >= 5.1)
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y liburing-dev
          make clean && make IO_URING=1
          printf '123\npassword\n' > /tmp/wl-io.txt
          ./hashmap wordlist --io-uring -w /tmp/wl-io.txt \
            -H 202cb962ac59075b964b07152d234b70 \
            -H 5f4dcc3b5aa765d61d8327deb882cf99
          # rebuild default binary for subsequent steps
          make clean && make
      - name: Portable static build
        run: make portable
      - name: Sanitizer build
        run: make debug
      - name: Run test suite under ASan/UBSan
        run: ./tests/run.sh ./hashmap-debug

  clang:
    name: strict build (clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          make clean
          make CC=clang
      - name: Run test suite
        run: ./tests/run.sh ./hashmap

  macos:
    name: build (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Quick test
        run: ./tests/run.sh ./hashmap
