name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to build (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: linux
            archive: tar.gz
          - name: linux-x86_64-static
            os: ubuntu-latest
            target: portable
            archive: tar.gz
          - name: macos-arm64
            os: macos-latest
            target: native
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: native
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Build (linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ "${{ matrix.target }}" = "portable" ]; then
            make portable
          else
            make
          fi

      - name: Build (macos)
        if: matrix.os == 'macos-latest'
        run: make

      - name: Build (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          gcc -std=c11 -O3 -pthread -Isrc -Wall -Wextra -Werror \
              -o hashmap.exe src/*.c
          ./hashmap.exe digest -i hello

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p pkg
          BIN=hashmap
          [ "${{ matrix.target }}" = "portable" ] && BIN=hashmap-portable
          cp "$BIN" pkg/
          cp README.md LICENSE pkg/
          tar -czf "hashmap-${{ matrix.name }}.tar.gz" -C pkg .
          echo "ASSET=hashmap-${{ matrix.name }}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item hashmap.exe pkg/
          Copy-Item README.md, LICENSE pkg/
          Compress-Archive -Path pkg/* -DestinationPath "hashmap-${{ matrix.name }}.zip"
          "ASSET=hashmap-${{ matrix.name }}.zip" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hashmap-${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -l dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: hashmap ${{ steps.tag.outputs.TAG }}
          generate_release_notes: true
          files: dist/*
